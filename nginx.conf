server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA — bütün marşrutlar index.html-ə düşür (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Statik asset-lər üçün keş
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
