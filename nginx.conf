server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API sorğuları daxili şəbəkə ilə backend konteynerinə ötürülür —
    # beləliklə tətbiq istənilən IP/hostname üzərindən işləyir
    location /api/ {
        proxy_pass http://backend:5199;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA — bütün marşrutlar index.html-ə düşür (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html heç vaxt keşlənməsin — yeni build dərhal görünsün
    # (asset-lər hash-li ad daşıyır, onlar üçün keş təhlükəsizdir)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Statik asset-lər üçün keş
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
