<svg width="220" height="260" viewBox="0 0 220 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="innerShield">
      <path d="M110 70 H170 V150 C170 192 142 214 110 226 C78 214 50 192 50 150 V70 Z"/>
    </clipPath>
  </defs>

  <!-- Xarici qızılı çərçivə -->
  <path d="M110 14 H190 V152 C190 206 156 240 110 254 C64 240 30 206 30 152 V14 Z"
        fill="#f5c518" stroke="#c79a00" stroke-width="2"/>
  <!-- Qırmızı haşiyə -->
