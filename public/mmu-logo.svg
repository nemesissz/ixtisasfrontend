    <ellipse rx="30" ry="11" transform="rotate(60)"/>
    <ellipse rx="30" ry="11" transform="rotate(120)"/>
  </g>
  <circle cx="110" cy="108" r="6.5" fill="#f5c518"/>
  <circle cx="140" cy="108" r="3.5" fill="#f5c518"/>
  <circle cx="95" cy="82" r="3.5" fill="#f5c518"/>
  <circle cx="95" cy="134" r="3.5" fill="#f5c518"/>

  <!-- Defnə budaqları (sadələşmiş) -->
