    <path d="M78 196 C58 178 56 156 64 138"/>
    <path d="M142 196 C162 178 164 156 156 138"/>
  </g>
  <g fill="#f5c518">
    <ellipse cx="66" cy="150" rx="3.5" ry="6" transform="rotate(-30 66 150)"/>
    <ellipse cx="62" cy="166" rx="3.5" ry="6" transform="rotate(-20 62 166)"/>
    <ellipse cx="66" cy="182" rx="3.5" ry="6" transform="rotate(-10 66 182)"/>
    <ellipse cx="154" cy="150" rx="3.5" ry="6" transform="rotate(30 154 150)"/>
    <ellipse cx="158" cy="166" rx="3.5" ry="6" transform="rotate(20 158 166)"/>
    <ellipse cx="154" cy="182" rx="3.5" ry="6" transform="rotate(10 154 182)"/>
