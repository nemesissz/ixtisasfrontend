    <rect x="50" y="70" width="40" height="160" fill="#19a04b"/>
    <rect x="90" y="70" width="40" height="160" fill="#e3242b"/>
    <rect x="130" y="70" width="40" height="160" fill="#3ec1f0"/>
  </g>
  <!-- Daxili qalxan haşiyəsi -->
  <path d="M110 70 H170 V150 C170 192 142 214 110 226 C78 214 50 192 50 150 V70 Z"
