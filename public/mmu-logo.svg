      <line x1="78" y1="162" x2="104" y2="166"/>
      <line x1="78" y1="170" x2="104" y2="174"/>
      <line x1="116" y1="158" x2="142" y2="154"/>
      <line x1="116" y1="166" x2="142" y2="162"/>
