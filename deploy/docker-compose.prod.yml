# ══════════════════════════════════════════════════════════════════
#  İxtisas Seçim Proqramı — İSTEHSAL (offline server, Ubuntu VM)
#
#  Image-lər öncədən qurulub .tar ilə gətirilir (build YOXDUR — offline).
#
#  ⚠ Bu faylın YANINDA `.env` faylı olmalıdır (nümunə: .env.example).
#    Parollar bu fayla YAZILMIR — hamısı .env-dən oxunur, .env isə git-ə düşmür.
#
#  İşə salmaq:  docker compose -f docker-compose.prod.yml up -d
#  Dayandırmaq: docker compose -f docker-compose.prod.yml down
#  Yoxlamaq:    curl http://localhost/api/health
# ══════════════════════════════════════════════════════════════════

services:
  db:
    image: mysql:8.4
    container_name: isp-db
    restart: always
    # Yüzlərlə eyni anda bağlantı üçün limit artırılır
    command: ["--max-connections=500", "--max-allowed-packet=64M"]
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:?.env faylında DB_ROOT_PASSWORD təyin edilməlidir}"
      MYSQL_DATABASE: "${DB_NAME:-mmuisp}"
      TZ: "${TZ:-Asia/Baku}"
    volumes:
      - isp_mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 30
    # Loglar zamanla diski doldurmasın (server aylarla işləyir)
    logging:
      driver: "json-file"
      options: { max-size: "10m", max-file: "3" }

  backend:
    image: mmu-ixtisas-backend:latest
    container_name: isp-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Production = Swagger və detallı xəta səhifələri BAĞLI.
      # Daxili şəbəkədə Swagger lazımdırsa buranı `Development` edin.
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Production}"
      ASPNETCORE_URLS: "http://+:5199"
      TZ: "${TZ:-Asia/Baku}"
      # TreatTinyAsBoolean=false — bool sahələrin (SourceProportional, AllowMale …)
      # oxunuşu development mühiti ilə eyni qalsın deyə mütləq saxlanılır
      ConnectionStrings__Default: "Server=db;Port=3306;Database=${DB_NAME:-mmuisp};User=root;Password=${DB_ROOT_PASSWORD:?.env faylında DB_ROOT_PASSWORD təyin edilməlidir};TreatTinyAsBoolean=false;"
      Jwt__Issuer: "${JWT_ISSUER:-MmuIspApi}"
      Jwt__Audience: "${JWT_AUDIENCE:-MmuIspFrontend}"
      Jwt__Key: "${JWT_KEY:?.env faylında JWT_KEY təyin edilməlidir (32+ simvol)}"
      Jwt__ExpiryMinutes: "${JWT_EXPIRY_MINUTES:-480}"
      # Boş = lokal + daxili şəbəkə mənşələrinə icazə (LAN üçün doğru davranış).
      # Konkret siyahı yalnız tətbiq internetə açılanda yazılır.
      Cors__AllowedOrigins: "${CORS_ALLOWED_ORIGINS:-}"
      # İlk superadmin — YALNIZ baza boş olduqda bir dəfə istifadə olunur.
      # Parol artıq mənbə kodunda deyil; verilməzsə backend açıq xəta ilə dayanır.
      Seed__AdminUsername: "${SEED_ADMIN_USERNAME:-admin}"
      Seed__AdminPassword: "${SEED_ADMIN_PASSWORD:?.env faylında SEED_ADMIN_PASSWORD təyin edilməlidir}"
      Seed__AdminEmail: "${SEED_ADMIN_EMAIL:-admin@mmu.az}"
    logging:
      driver: "json-file"
      options: { max-size: "10m", max-file: "3" }

  frontend:
    image: mmu-ixtisas-frontend:latest
    container_name: isp-frontend
    restart: always
    depends_on:
      - backend
    environment:
      TZ: "${TZ:-Asia/Baku}"
    ports:
      # Port 80 → kursantlar sadəcə http://SERVER_IP açır (port yazmadan)
      - "80:80"
    logging:
      driver: "json-file"
      options: { max-size: "10m", max-file: "3" }

volumes:
  isp_mysqldata:
