# ══════════════════════════════════════════════════════════════════
#  İxtisas Seçim Proqramı — offline quraşdırma (C:\ISP)
#
#  Bu qovluqda olmalıdır:  docker-compose.offline.yml, isp-images.tar, .env
#  İlk dəfə:      ISP-yenile.bat   (image-ləri yükləyir və işə salır)
#  Dayandırmaq:   docker compose -f docker-compose.offline.yml down   (data qalır)
#  Yoxlamaq:      docker compose -f docker-compose.offline.yml ps
#  Sayt:          http://localhost:5174   (şəbəkədən: http://SERVER_IP:5174)
# ══════════════════════════════════════════════════════════════════

services:
  db:
    image: mysql:8.4
    container_name: isp-db
    restart: always
    command: ["--max-connections=500", "--max-allowed-packet=64M"]
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:?.env faylında DB_ROOT_PASSWORD yoxdur}"
      MYSQL_DATABASE: "${DB_NAME:-mmuisp}"
      TZ: "${TZ:-Asia/Baku}"
    volumes:
      - isp_mysqldata:/var/lib/mysql
    # Workbench ilə qoşulmaq lazım olsa açın:
    # ports:
    #   - "3307:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 5s
      timeout: 5s
      retries: 30
    logging:
      driver: "json-file"
      options: { max-size: "10m", max-file: "3" }

  backend:
    image: mmu-ixtisas-backend:latest
    container_name: isp-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Production}"
      ASPNETCORE_URLS: "http://+:5199"
      TZ: "${TZ:-Asia/Baku}"
      ConnectionStrings__Default: "Server=db;Port=3306;Database=${DB_NAME:-mmuisp};User=root;Password=${DB_ROOT_PASSWORD};TreatTinyAsBoolean=false;"
      Jwt__Issuer: "MmuIspApi"
      Jwt__Audience: "MmuIspFrontend"
      Jwt__Key: "${JWT_KEY:?.env faylında JWT_KEY yoxdur}"
      Jwt__ExpiryMinutes: "${JWT_EXPIRY_MINUTES:-480}"
      Cors__AllowedOrigins: "${CORS_ALLOWED_ORIGINS:-}"
      # İlk superadmin — yalnız baza boş olanda bir dəfə yaradılır
      Seed__AdminUsername: "${SEED_ADMIN_USERNAME:-admin}"
      Seed__AdminPassword: "${SEED_ADMIN_PASSWORD:?.env faylında SEED_ADMIN_PASSWORD yoxdur}"
      Seed__AdminEmail: "${SEED_ADMIN_EMAIL:-admin@mmu.az}"
    # Swagger lazım olsa açın (və ASPNETCORE_ENVIRONMENT=Development edin):
    # ports:
    #   - "5199:5199"
    logging:
      driver: "json-file"
      options: { max-size: "10m", max-file: "3" }

  frontend:
    image: mmu-ixtisas-frontend:latest
    container_name: isp-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "5174:80"
    logging:
      driver: "json-file"
      options: { max-size: "10m", max-file: "3" }

volumes:
  isp_mysqldata:
    name: isp_mysqldata
